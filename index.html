<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFEEEB">
<title>a|m dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: barra lateral clara fixa + área principal; cada aba abre com título editorial, números finos, cartões-destaque com degradê e o detalhe abaixo. No celular a lateral vira barra flutuante. Tema único claro, por escolha. */
:root{
  color-scheme:light;
  --ground:#EFEEEB; --side:#E8E6E2; --surface:#FFFFFF; --surface-2:#F6F5F3; --chip:#E6E4E0;
  --ink:#1D1D1B; --ink-2:#4A4945; --muted:#8C8A85; --faint:#B9B6B0; --hair:rgba(29,29,27,.07);
  --lime:#DDF24B; --lime-ink:#2B3200;
  --orange:#FF7B3D; --rose:#FF5C8A; --leaf:#4FB06A; --lilac:#9E8BEA; --sky:#7FB0F2;
  --ok:#2D6B3A; --ok-soft:#E6F4E2; --warn:#A2471A; --warn-soft:#FFEBDD; --bad:#A3224B; --bad-soft:#FFE3EB;
  --none:#5B47B8; --none-soft:#EEEAFD; --closed:#2F5E9E; --closed-soft:#E6F0FE;
  --s-dentro:#8ACB86; --s-meio:#FFC37E; --s-muito:#FF7C9D; --s-pulada:#D3CFC9; --s-ptncho:#B9A8F2; --s-lip:#93C2F7;
  --f-sans:"Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px;
  --shadow:0 1px 2px rgba(29,29,27,.04), 0 12px 32px -12px rgba(29,29,27,.10);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 16px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:-.025em;text-wrap:balance}
h1 em,h2 em{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1320px;margin:0 auto;min-height:100vh;padding-block:16px}

/* Lateral */
aside{background:var(--side);border-radius:var(--r-xl);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:calc(100vh - 32px);overflow:auto}
.me{display:flex;gap:12px;align-items:center;padding:0 6px}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:500;background:radial-gradient(circle at 30% 30%,#FFD9C2,transparent 60%),radial-gradient(circle at 75% 70%,#C9B9F5,transparent 60%),#F4EEE9}
.me b{display:block;font-weight:500;letter-spacing:-.01em}
.me span{color:var(--muted);font-size:.84rem}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .label{padding:0 12px 6px}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--ink-2);font-size:.92rem}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:rgba(255,255,255,.5)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,29,27,.05)}
.nav .count{margin-left:auto;font-size:.72rem;background:var(--surface);border-radius:6px;padding:1px 7px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.nav[aria-current="page"] .count{background:var(--surface-2)}
.pinned{all:unset;box-sizing:border-box;cursor:pointer;display:block;margin-top:auto;background:rgba(255,255,255,.55);border-radius:var(--r-md);padding:12px 14px}
.store{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2)}
.store i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.store.db i{background:var(--leaf)} .store.local i{background:var(--orange)}

/* Principal */
main{padding:28px 8px 120px 40px;min-width:0;display:flex;flex-direction:column;gap:28px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.8rem;color:var(--ink-2)}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--leaf)}
h1{font-size:clamp(2.2rem,4.6vw,3.6rem);line-height:1.02;letter-spacing:-.045em;margin-top:14px}
h2{font-size:1.6rem;letter-spacing:-.035em}
h3{font-size:1.05rem;font-weight:500;letter-spacing:-.015em}
.lede{color:var(--muted);max-width:56ch;margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--surface);font-size:.88rem;font-weight:500;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{box-shadow:0 1px 2px rgba(29,29,27,.06),0 14px 36px -10px rgba(29,29,27,.16)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:none}
.btn.soft{background:var(--surface-2);box-shadow:none}
.btn.sm{height:32px;padding:0 12px;font-size:.82rem}
.btn.icon{width:40px;padding:0;justify-content:center}
.btn.sm.icon{width:32px}
.btn svg{width:16px;height:16px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.stats{display:flex;gap:clamp(20px,5vw,60px);flex-wrap:wrap;align-items:flex-end}
.stat{display:flex;align-items:flex-start;gap:6px}
.stat b{font-weight:300;letter-spacing:-.04em;font-size:clamp(2.6rem,4.8vw,3.6rem);line-height:.9;font-variant-numeric:tabular-nums}
.stat b small{font-size:.5em;letter-spacing:-.02em;color:var(--muted)}
.stat span{font-size:.72rem;background:var(--surface);border-radius:999px;padding:2px 8px;color:var(--ink-2);white-space:nowrap;margin-top:2px}
.stat span.lime{background:var(--lime);color:var(--lime-ink)}
.stat span.rose{background:var(--bad-soft);color:var(--bad)}

/* Cartões etéreos */
.hero{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px}
.hero.two{grid-template-columns:1.35fr 1fr;align-items:start}
.hero>*,.grid2>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.glow{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 24px;min-height:270px;display:flex;flex-direction:column;isolation:isolate;color:#fff}
.glow::before{content:"";position:absolute;inset:-30%;z-index:-1;filter:blur(38px)}
.glow.warm{background:#F8DCC8}
.glow.warm::before{background:radial-gradient(circle at 30% 70%,#FFD08A 0,transparent 42%),radial-gradient(circle at 55% 78%,#FF6A2B 0,transparent 48%),radial-gradient(circle at 85% 20%,#FFB7C9 0,transparent 40%),radial-gradient(circle at 12% 15%,#F5E3D6 0,transparent 45%)}
.glow.green{background:#E2EBD2}
.glow.green::before{background:radial-gradient(circle at 35% 85%,#3FA34D 0,transparent 45%),radial-gradient(circle at 70% 60%,#9ED36A 0,transparent 42%),radial-gradient(circle at 45% 10%,#F6C79A 0,transparent 45%),radial-gradient(circle at 90% 90%,#2E8B57 0,transparent 35%)}
.glow.rose{background:#F6D7E0}
.glow.rose::before{background:radial-gradient(circle at 60% 70%,#FF3F7A 0,transparent 42%),radial-gradient(circle at 25% 80%,#FF9DB8 0,transparent 40%),radial-gradient(circle at 80% 15%,#FFD4C2 0,transparent 42%),radial-gradient(circle at 15% 15%,#F4E6EC 0,transparent 45%)}
.glow.sky{background:#DCE3F2}
.glow.sky::before{background:radial-gradient(circle at 60% 72%,#FF9A3D 0,transparent 36%),radial-gradient(circle at 30% 80%,#7FA6F5 0,transparent 42%),radial-gradient(circle at 80% 20%,#C7B5F5 0,transparent 42%),radial-gradient(circle at 15% 15%,#E8ECF6 0,transparent 45%)}
.glow .lbl{font-size:.86rem;opacity:.75}
.glow h3{font-size:1.35rem;font-weight:400;letter-spacing:-.02em;margin-top:2px}
.glow .sub{font-size:.84rem;opacity:.85}
.glow.warm .lbl,.glow.warm h3,.glow.warm .sub{color:#5E2A10}
.glow.green .lbl,.glow.green h3,.glow.green .sub{color:#2C4A1F}
.glow.rose .lbl,.glow.rose h3,.glow.rose .sub{color:#5E1430}
.glow.sky .lbl,.glow.sky h3,.glow.sky .sub{color:#22325E}
.big{font-weight:300;font-size:clamp(4rem,8vw,6.4rem);line-height:.85;letter-spacing:-.05em;margin-top:auto;display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.big small{font-size:.95rem;font-weight:400;letter-spacing:0;opacity:.9}
.ruler-wrap{position:relative;margin-top:16px}
.ruler{height:30px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 1px,transparent 1px 9px);-webkit-mask:linear-gradient(transparent 40%,#000 40%);mask:linear-gradient(transparent 40%,#000 40%)}
.ruler-wrap .mark{position:absolute;top:0;width:2px;height:30px;background:#fff;border-radius:2px}
.ruler-wrap .ends{display:flex;justify-content:space-between;font-size:.72rem;opacity:.9;margin-top:6px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;font-size:.84rem}
.names span{background:rgba(255,255,255,.24);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:3px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glow .gcells{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.glow .gcells .cell{background:rgba(255,255,255,.25)}
.glow .gcells .wd{font-size:.7rem;text-align:center;opacity:.9}

.panel{background:var(--surface);border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel .note{font-size:.78rem;color:var(--muted)}
.todo{display:flex;flex-direction:column}
.todo>div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;font-size:.88rem;border-bottom:1px solid var(--hair);cursor:pointer}
.todo>div:last-child{border-bottom:none}
.todo i{width:8px;height:8px;border-radius:50%}
.todo .d{color:var(--muted);font-size:.78rem;white-space:nowrap}

.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-head p{color:var(--muted);font-size:.86rem;margin-top:2px}

/* Fila de cartões */
.queue{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(188px,1fr);gap:14px;overflow-x:auto;padding:4px 2px 16px;scroll-snap-type:x mandatory}
.qcard{cursor:pointer;scroll-snap-align:start;background:var(--surface);border-radius:var(--r-lg);padding:14px 16px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:220px;isolation:isolate}
.badge{align-self:flex-start;font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.badge.lime{background:var(--lime);color:var(--lime-ink)}
.badge.ex{background:var(--none-soft);color:var(--none)}
.orb{width:58px;height:58px;border-radius:50%;margin:10px auto 6px;position:relative;flex:none}
.orb::after{content:"";position:absolute;left:10%;right:10%;bottom:-12px;height:16px;border-radius:50%;background:inherit;filter:blur(10px);opacity:.5;z-index:-1}
.orb.ok{background:radial-gradient(circle at 35% 30%,#fff 0 8%,#BFE8B5 22%,#4FB06A 62%,#2F8048 100%)}
.orb.warn{background:radial-gradient(circle at 35% 30%,#fff 0 8%,#FFD3B5 22%,#FF8A4C 62%,#E0602A 100%)}
.orb.bad{background:radial-gradient(circle at 35% 30%,#fff 0 8%,#FFC2D3 22%,#FF5C8A 62%,#D63A6A 100%)}
.orb.nodate,.orb.none{background:radial-gradient(circle at 35% 30%,#fff 0 8%,#DCD3FB 22%,#9E8BEA 62%,#7A66D1 100%)}
.orb.closed{background:radial-gradient(circle at 35% 30%,#fff 0 8%,#D5E7FF 22%,#8DB8F5 62%,#5E8FD6 100%)}
.orb.off{background:radial-gradient(circle at 35% 30%,#fff 0 8%,#E8E6E2 22%,#B9B6B0 62%,#9A978F 100%)}
.orb.sm{width:26px;height:26px;margin:0}
.orb.sm::after{bottom:-6px;height:8px;filter:blur(5px)}
.qcard .nm{font-weight:500;font-size:.92rem;line-height:1.3;letter-spacing:-.01em}
.qcard .ct{color:var(--muted);font-size:.78rem}
.qcard .days{margin-top:auto;display:flex;align-items:baseline;gap:6px}
.qcard .days b{font-weight:300;letter-spacing:-.04em;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.qcard .days span{font-size:.78rem;color:var(--muted)}

/* Filtros e lista */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{all:unset;cursor:pointer;height:36px;padding:0 15px;border-radius:12px;background:var(--chip);font-size:.88rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,29,27,.06)}
.chip em{font-style:normal;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;background:var(--surface);border-radius:999px;padding:0 14px;min-width:0;flex:0 1 260px}
.search input{all:unset;flex:1;min-width:0;font-size:.9rem}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.prod{cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1.6fr) minmax(0,1fr) 96px 170px 18px;gap:16px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:12px 16px}
.prod:hover{box-shadow:var(--shadow)}
.prod .nm{display:block;font-weight:500;font-size:.93rem;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .ct{display:block;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .use{font-size:.84rem;color:var(--ink-2)}
.pill{justify-self:start;font-size:.76rem;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.nodate,.pill.none{background:var(--none-soft);color:var(--none)}.pill.closed{background:var(--closed-soft);color:var(--closed)}.pill.off{background:var(--surface-2);color:var(--muted)}
.pill.ex{background:var(--none-soft);color:var(--none);margin-left:6px;font-size:.68rem;padding:1px 7px}
.chev{color:var(--faint);transition:transform .2s;display:flex}
.chev svg{width:16px;height:16px}
.prod[aria-expanded="true"] .chev{transform:rotate(90deg)}
.more{grid-column:2 / -1;color:var(--ink-2);font-size:.86rem;border-top:1px solid var(--hair);padding-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 24px;cursor:default}
.more .k{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.more .fb{grid-column:1 / -1;white-space:pre-wrap}
.more .acts{grid-column:1 / -1;display:flex;gap:8px}
.empty{color:var(--muted);padding:28px 24px;text-align:center;background:var(--surface);border-radius:var(--r-xl)}
.empty h3{color:var(--ink);margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--none-soft);color:var(--ink-2);border-radius:var(--r-md);padding:10px 10px 10px 16px;font-size:.88rem}
.rows{display:flex;flex-direction:column}
.rowi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.rowi:last-child{border-bottom:none}
.rowi b{font-weight:500}
.rowi .sub{color:var(--muted);font-size:.8rem}

/* Diário */
.entry{display:grid;grid-template-columns:130px 1fr;gap:12px 16px;align-items:center}
.entry .meal{font-size:.9rem;color:var(--ink-2)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:.82rem;color:var(--ink-2)}
.opt i{width:9px;height:9px;border-radius:50%}
.opt:hover{background:var(--chip)}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff}
.field-in{all:unset;background:var(--surface-2);border-radius:12px;height:40px;padding:0 14px;font-size:.9rem;width:100%;box-sizing:border-box}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{all:unset;background:var(--surface-2);border-radius:999px;height:32px;padding:0 12px;font-size:.84rem}
.donutwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:200px}
.legend div{display:grid;grid-template-columns:10px 1fr auto 52px;gap:10px;align-items:center;font-size:.88rem}
.legend i{width:9px;height:9px;border-radius:50%}
.stackbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.stackbar span{height:100%;border-radius:999px}
.mealrow{display:grid;grid-template-columns:120px 1fr 44px;gap:12px;align-items:center;font-size:.88rem;padding:5px 0}
.insights{display:flex;flex-direction:column;gap:8px;font-size:.92rem;padding:0;margin:0;list-style:none}
.insights li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:baseline}
.insights li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);transform:translateY(-2px)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:.76rem;color:var(--muted)}
.wk div .b{width:100%;max-width:36px;border-radius:10px;background:linear-gradient(180deg,#B6E3A8,#6FBF72)}
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(24px,1fr));gap:5px;font-size:.74rem;align-items:center}
.cal .h{color:var(--muted);text-align:center}
.cal .wl{color:var(--muted);font-variant-numeric:tabular-nums}
.cell{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;height:34px;border-radius:8px;overflow:hidden;background:var(--surface-2);padding:3px;box-sizing:border-box}
.cell span{flex:1;border-radius:3px}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.calscroll{max-height:440px;overflow-y:auto;padding:2px 4px 2px 2px}
svg text{fill:var(--muted);font-family:var(--f-sans)}

/* Rotina */
.habit{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(7,minmax(32px,1fr)) 56px;gap:6px;align-items:center;font-size:.9rem}
.habit .h{text-align:center;color:var(--muted);font-size:.74rem;line-height:1.3}
.tick{all:unset;cursor:pointer;height:36px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:transparent}
.tick svg{width:16px;height:16px}
.tick[aria-pressed="true"]{background:var(--ink);color:#fff}
.tick.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tick[disabled]{opacity:.35;pointer-events:none}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#B6E3A8,#4FB06A)}
.check{display:flex;gap:10px;align-items:center;font-size:.92rem;cursor:pointer;padding:6px 0}
.check input{width:18px;height:18px;accent-color:var(--ink);margin:0}

/* Quadros */

const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1,12)};
const today=()=>toISO(new Date());
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return toISO(d)};

const addMonths=(s,n)=>{const d=parseISO(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return toISO(d)};
const endOfMonth=ym=>{const [y,m]=ym.split('-').map(Number);return toISO(new Date(y,m,0,12))};

const COLS=['skincare','suplementos','perfumes','diario','marcos','exames','consultas','ficha','viagens','projetos','financas','habitos','rotina'];
const TABS=[
  ['inicio','Início'],['diario','Diário alimentar'],['skincare','Skincare'],['suplementos','Suplementos'],['perfumes','Perfumes'],
  ['saude','Saúde'],['rotina','Rotina'],['viagens','Viagens'],['projetos','Projetos'],['financas','Finanças']];

const ST=[
  {k:'dentro',l:'Dentro do plano',c:'var(--s-dentro)'},
  {k:'meio',l:'Meio fora',c:'var(--s-meio)'},
  {k:'muito',l:'Muito fora',c:'var(--s-muito)'},
  {k:'pulada',l:'Refeição pulada',c:'var(--s-pulada)'},
  {k:'ptncho',l:'− PTN + CHO',c:'var(--s-ptncho)'},
  {k:'lip',l:'+ LIP',c:'var(--s-lip)'}];
const STM=Object.fromEntries(ST.map(s=>[s.k,s]));
const MEALS=[{k:'cafe',l:'Café da manhã'},{k:'almoco',l:'Almoço'},{k:'lanche',l:'Café da tarde'},{k:'jantar',l:'Jantar'}];
const WD=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

/* ---------- armazenamento: Google Sheets via Apps Script ---------- */
const S={mode:'boot',ready:false,status:'',lastErr:'',data:{},pending:{}};
COLS.forEach(c=>S.data[c]=[]);
const CFG={url:lsGet('sp-url')||'',token:lsGet('sp-token')||''};

async function api(payload,cfg){
  const c=cfg||CFG;
  const r=await fetch(c.url,{method:'POST',body:JSON.stringify({...payload,token:c.token})});
  if(!r.ok){const e=new Error('http_'+r.status);e.code='http';throw e}
  let j; try{j=await r.json()}catch(_){const e=new Error('resposta_invalida');e.code='resposta_invalida';throw e}
  if(!j.ok){const e=new Error(j.erro||'erro');e.code=j.erro||'erro';throw e}
  return j;
}
function rowsToData(d){
  const out={}; COLS.forEach(c=>out[c]=[]);
  for(const c of COLS){
    const rows=(d&&d[c])||[];
    if(c==='diario'){const m={};rows.forEach(r=>{const day={};['cafe','almoco','lanche','jantar','obs'].forEach(k=>{if(r[k])day[k]=r[k]});if(!Object.keys(day).length)return;const ym=r.id.slice(0,7);(m[ym]=m[ym]||{id:ym,dias:{}}).dias[r.id]=day});out[c]=Object.values(m)}
    else if(c==='rotina'){const m={};rows.forEach(r=>{const l=String(r.habitos||'').split(',').filter(Boolean);if(!l.length)return;const ym=r.id.slice(0,7);(m[ym]=m[ym]||{id:ym,dias:{}}).dias[r.id]=l});out[c]=Object.values(m)}
    else out[c]=rows.map(r=>{const o={...r};if(o.exemplo==='true'||o.exemplo===true)o.exemplo=true;else delete o.exemplo;return o});
  }
  return out;
}
function cache(){lsSet('sp-cache',JSON.stringify(S.data))}
function persist(){lsSet('sp-pending',JSON.stringify(S.pending));cache()}

async function initStore(){
  try{const c=lsGet('sp-cache');if(c){const o=JSON.parse(c);COLS.forEach(k=>{if(Array.isArray(o[k]))S.data[k]=o[k]});S.ready=true}}catch(e){}
  try{const p=lsGet('sp-pending');if(p)S.pending=JSON.parse(p)||{}}catch(e){}
  if(!CFG.url||!CFG.token){S.mode='setup';setStoreBadge();render(true);return}
  S.mode='sheets'; setStoreBadge(); render(true);
  await refresh();
}
async function refresh(){
  if(S.mode!=='sheets')return;
  if(Object.keys(S.pending).length){await flush();if(Object.keys(S.pending).length)return}
  S.status='sync';setStoreBadge();
  try{const j=await api({action:'all'});S.data=rowsToData(j.dados);S.ready=true;cache();S.status='ok'}
  catch(e){S.status='off';S.lastErr=e.code||e.message;if(e.code==='senha_incorreta')toast('A planilha recusou a senha. Confira em Ajustes.')}
  setStoreBadge(); render();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
setInterval(()=>{if(document.visibilityState==='visible')refresh()},5*60*1000);

function localPut(col,id,body){const arr=S.data[col].slice();const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]={id,...body};else arr.push({id,...body});S.data[col]=arr}
function opsFor(col,id,body,prev){
  if(col==='diario'||col==='rotina'){
    const a=(prev&&prev.dias)||{},b=(body&&body.dias)||{};const res=[];
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(d=>{
      const x=a[d],y=b[d]; if(JSON.stringify(x)===JSON.stringify(y))return;
      const empty=y==null||(Array.isArray(y)?!y.length:!Object.keys(y).length);
      if(empty)res.push([col+'/'+d,{op:'delete',aba:col,id:d}]);
      else res.push([col+'/'+d,{op:'upsert',aba:col,linha:col==='diario'?{id:d,...y}:{id:d,habitos:y.join(',')}}]);
    });
    return res;
  }
  if(body==null)return[[col+'/'+id,{op:'delete',aba:col,id}]];
  const linha={id};for(const [k,v] of Object.entries(body)){if(v===''||v==null||k==='id')continue;linha[k]=typeof v==='boolean'?String(v):v}
  return[[col+'/'+id,{op:'upsert',aba:col,linha}]];
}
function save(col,id,body){
  const prev=S.data[col].find(x=>x.id===id);
  opsFor(col,id,body,prev).forEach(([k,o])=>S.pending[k]=o);
  localPut(col,id,body); persist(); schedule(); queueFlush();
  return Promise.resolve();
}
async function remove(col,id){
  const prev=S.data[col].find(x=>x.id===id);
  opsFor(col,id,null,prev).forEach(([k,o])=>S.pending[k]=o);
  S.data[col]=S.data[col].filter(x=>x.id!==id); persist(); schedule(); queueFlush();
}
let flushT=null,flushing=false;
function queueFlush(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms??700)}
async function flush(){
  if(flushing||S.mode!=='sheets')return;
  const keys=Object.keys(S.pending).slice(0,300); if(!keys.length)return;
  flushing=true; const snap=keys.map(k=>[k,S.pending[k]]);
  S.status='sync'; setStoreBadge();
  try{
    await api({action:'batch',ops:snap.map(s=>s[1])});
    snap.forEach(([k,o])=>{if(S.pending[k]===o)delete S.pending[k]});
    S.status='ok';
  }catch(e){S.status='off';S.lastErr=e.code||e.message;queueFlush(20000)}
  persist(); flushing=false; setStoreBadge();

/* ---------- lógica de validade ---------- */
function expiry(it){
  const c=[]; if(it.validade)c.push(endOfMonth(it.validade));
  if(it.aberto_em&&+it.pao)c.push(addMonths(it.aberto_em,+it.pao));
  c.sort(); return c[0]||null;
}
function invState(it){
  const exp=expiry(it);
  if(it.em_uso==='Acabou'||it.em_uso==='Descartado')return{k:'off',label:it.em_uso,exp,rank:5};
  if(!exp){
    if(+it.pao&&!it.aberto_em){ return it.em_uso==='Não'?{k:'closed',label:`Fechado · PAO ${it.pao}M`,rank:4}:{k:'nodate',label:'Falta data de abertura',rank:3} }
    return{k:'nodate',label:'Sem data',rank:3};
  }
  const d=diffDays(today(),exp);
  if(d<0)return{k:'bad',label:'Vencido',d,exp,rank:0};
  if(d<=30)return{k:'bad',label:d===0?'Vence hoje':`Vence em ${d} d`,d,exp,rank:1};
  if(d<=90)return{k:'warn',label:`Vence em ${d} d`,d,exp,rank:1};
  return{k:'ok',label:'Até '+fmtD(exp),d,exp,rank:2};
}
function stockLeft(it){
  if(!(+it.estoque)||!(+it.por_dia))return null;
  const since=it.estoque_data?Math.max(0,diffDays(it.estoque_data,today())):0;
  const left=Math.max(0,+it.estoque-(it.em_uso==='Sim'?since*+it.por_dia:0));
  return{left,days:Math.floor(left/+it.por_dia)};
}
const active=it=>!['Acabou','Descartado'].includes(it.em_uso);

  return `${exampleBanner([col])}${head(cp.tag,cp.t,cp.lede,actions)}
  ${stats([[pad(act.length),sc.noun==='produto'?'Produtos':'Itens'],[pad(n.uso),'Em uso','lime'],[pad(n.v90),'Vencem em 90 dias'],[pad(n.venc),'Vencidos',n.venc?'rose':''],[pad(n.sem),'Sem data']])}

function cellHTML(d,v,sel){
  v=v||{}; const any=MEALS.some(m=>v[m.k]);
  const tip=`${fmtD(d)}\n`+MEALS.map(m=>`${m.l}: ${v[m.k]?STM[v[m.k]].l:'—'}`).join('\n');
  return `<button class="cell${sel?' sel':''}" data-day="${d}" title="${esc(tip)}" aria-label="${esc(tip)}">${any?MEALS.map(m=>`<span style="background:${v[m.k]?STM[v[m.k]].c:'transparent'}"></span>`).join(''):''}</button>`;
}
function diarioRange(days){
  const D=UI.diario, t=today(); const keys=Object.keys(days).sort();
  const marcos=S.data.marcos.slice().sort((a,b)=>a.data<b.data?-1:1);
  let from,to=t,label;
  switch(D.preset){
    case'30':from=addDays(t,-29);label='últimos 30 dias';break;
    case'90':from=addDays(t,-89);label='últimos 90 dias';break;
    case'ultimo':{const m=marcos.filter(m=>m.data<=t).pop(); from=m?m.data:addDays(t,-29); label=m?`desde “${m.titulo}”`:'últimos 30 dias';break}
    case'marcos':{const a=marcos.find(m=>m.id===D.m1)||marcos[0], b=marcos.find(m=>m.id===D.m2);
      from=a?a.data:keys[0]; to=b?addDays(b.data,-1):t; label=a?`de “${a.titulo}” ${b?`até “${b.titulo}”`:'até hoje'}`:'todo o período';break}
    case'custom':from=D.from||addDays(t,-29);to=D.to||t;label=`${fmtD(from)} a ${fmtD(to)}`;break;
    default:from=keys[0]||t;to=keys[keys.length-1]||t;label='todo o histórico';
  }
  if(from>to)[from,to]=[to,from];
  return{from,to,label,marcos};
}
function viewDiario(){

     ${D.preset==='marcos'?`<div class="tools"><span class="small muted">De</span>${msel('m1',D.m1||(marcos[0]||{}).id)}<span class="small muted">até</span>${msel('m2',D.m2,true)}</div>`:''}
     ${D.preset==='custom'?`<div class="tools"><input class="field-in" type="date" id="d-from" value="${from}" style="width:auto;height:36px"><span class="muted small">até</span><input class="field-in" type="date" id="d-to" value="${to}" style="width:auto;height:36px"></div>`:''}`;
  const top=head('Alimentação','Diário <em>alimentar</em>',`Período: ${label} · ${inRange.length} ${inRange.length===1?'dia':'dias'} com registro.`,`${btnImp('diario')}${btnExp('diario')}<button class="btn dark" data-new="marcos">${ico('plus')}Marco</button>`);
  if(!tot) return `${top}${entry}<section class="sec">${period}</section>${empty('Sem registros neste período','Registre acima, escolha outro período ou importe sua planilha.')}${marcosPanel(marcos)}`;
  let acc=0;const R=58,C=2*Math.PI*R,gap=2;
  const segs=ST.filter(s=>cnt[s.k]).map(s=>{const len=cnt[s.k]/tot*C;const el=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap)} ${C-Math.max(0,len-gap)}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"><title>${s.l}: ${cnt[s.k]}</title></circle>`;acc+=len;return el}).join('');
  const donut=`<svg viewBox="0 0 160 160" width="170" height="170" role="img" aria-label="Distribuição das refeições">${segs}<text x="80" y="84" text-anchor="middle" style="font-size:30px;font-weight:300;letter-spacing:-1.5px;fill:var(--ink)">${pct(cnt.dentro,tot)}%</text><text x="80" y="102" text-anchor="middle" style="font-size:10px">dentro do plano</text></svg>`;
  const legend=`<div class="legend">${ST.map(s=>`<div><i style="background:${s.c}"></i><span>${s.l}</span><b class="num" style="font-weight:500">${cnt[s.k]}</b><span class="muted num" style="text-align:right">${(cnt[s.k]/tot*100).toFixed(1).replace('.',',')}%</span></div>`).join('')}</div>`;
  const wk=Object.keys(weeks).sort().filter(w=>weeks[w].t>=4);
  let trend='<p class="muted small">Período curto demais para mostrar tendência. Escolha 90 dias ou mais.</p>';
  if(wk.length>=3){
    const W=760,H=210,L=36,Rr=12,T=18,B=28; const x=i=>L+(W-L-Rr)*(i/(wk.length-1)); const y=v=>T+(H-T-B)*(1-v/100);
    const pts=wk.map((w,i)=>[x(i),y(weeks[w].d/weeks[w].t*100),w]);
    let dPath=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const cx=(x0+x1)/2;dPath+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`}
    const area=`${dPath} L${pts[pts.length-1][0]},${y(0)} L${pts[0][0]},${y(0)} Z`;
    const ticks=[0,50,100].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(29,29,27,.07)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10">${v}%</text>`).join('');
    const step=Math.ceil(wk.length/7); const xl=wk.map((w,i)=>i%step===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10">${fmtDS(w)}</text>`:'').join('');
    const toX=d=>{let i=wk.findIndex(w=>w>mondayOf(d));i=i<0?wk.length-1:Math.max(0,i-1);const frac=Math.min(1,diffDays(wk[i],d)/7);return x(i)+(i<wk.length-1?(x(i+1)-x(i))*frac:0)};
    const mk=marcos.filter(m=>m.data>=wk[0]&&m.data<=addDays(wk[wk.length-1],6)).map(m=>{const X=toX(m.data);return `<line x1="${X}" x2="${X}" y1="${T}" y2="${y(0)}" stroke="rgba(29,29,27,.25)" stroke-dasharray="2 4"/><text x="${X+4}" y="${T+6}" font-size="9.5">${esc(m.titulo.length>20?m.titulo.slice(0,19)+'…':m.titulo)}</text>`}).join('');
    const last=pts[pts.length-1];
    trend=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Porcentagem dentro do plano por semana"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ACB86" stop-opacity=".45"/><stop offset="1" stop-color="#8ACB86" stop-opacity="0"/></linearGradient></defs>${ticks}<path d="${area}" fill="url(#ga)"/><path d="${dPath}" fill="none" stroke="#3F8F4E" stroke-width="1.8"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="transparent"><title>Semana de ${fmtD(p[2])}: ${Math.round(weeks[p[2]].d/weeks[p[2]].t*100)}% (${weeks[p[2]].t} refeições)</title></circle>`).join('')}<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#3F8F4E" stroke="#fff" stroke-width="2"/>${mk}${xl}</svg>`;
  }
  const mealsBlock=MEALS.map(m=>{const pm=perMeal[m.k];const t=Object.values(pm).reduce((a,b)=>a+b,0)||1;return `<div class="mealrow"><span>${m.l}</span><div class="stackbar">${ST.map(s=>pm[s.k]?`<span style="width:${pm[s.k]/t*100}%;background:${s.c}" title="${s.l}: ${pm[s.k]}"></span>`:'').join('')}</div><span class="num muted" style="text-align:right">${pct(pm.dentro,t)}%</span></div>`}).join('');
  const wdBlock=`<div class="wk">${perWd.map((w,i)=>{const p=pct(w.d,w.t);return `<div><span class="num" style="color:var(--ink-2)">${w.t?p+'%':'—'}</span><span class="b" style="height:${Math.max(3,p)}%"></span><span>${WD[i]}</span></div>`}).join('')}</div>`;

  const worst=mealOut.slice().sort((a,b)=>b.out/b.t-a.out/a.t)[0]; const skipped=mealOut.slice().sort((a,b)=>b.skip/b.t-a.skip/a.t)[0];
  const sum=a=>a.reduce((x,w)=>({t:x.t+w.t,d:x.d+w.d}),{t:0,d:0}); const wdT=sum(perWd.slice(0,5)),weT=sum(perWd.slice(5));
  const ins=[];

  </section>

async function setMeal(date,meal,st){
  const ym=date.slice(0,7); const doc=S.data.diario.find(x=>x.id===ym)||{id:ym,dias:{}};
  const dias=JSON.parse(JSON.stringify(doc.dias||{})); const day=dias[date]||{};
  if(st===null||day[meal]===st)delete day[meal]; else day[meal]=st;
  if(Object.keys(day).length)dias[date]=day; else delete dias[date];
  await save('diario',ym,{dias});

  const isD=col==='diario';
  $('#dlgform').innerHTML=`<div class="mh"><h2>Importar planilha</h2><button type="button" class="btn sm icon soft" data-close aria-label="Fechar">${ico('x')}</button></div>
  <div class="mb"><div class="field full"><label for="imp-file">Arquivo .xlsx ou .csv</label><input type="file" id="imp-file" accept=".csv,.xlsx,.xls"></div>
  <p class="muted small full">${isD?'Formato do seu diário: blocos semanais com as datas na primeira linha, os dias da semana na segunda e uma linha por refeição. Dias já registrados são atualizados com o que estiver preenchido no arquivo.':'A primeira linha precisa ter os nomes das colunas. Colunas reconhecidas: '+SCHEMA[col].fields.map(f=>f.l).join(', ')+'. Validades como “VAL FEV/2027”, “01/2027” ou “12M” são lidas automaticamente.'}</p>
  ${isD?'':`<label class="check full"><input type="checkbox" id="imp-merge" checked> Atualizar itens que já existem com o mesmo nome</label>`}
  <div id="imp-prev" class="full small"></div></div>
  <div class="mf"><span></span><div class="actions"><button type="button" class="btn soft" data-close>Cancelar</button><button type="submit" class="btn dark" id="imp-go" disabled>Importar</button></div></div>`;
  $('#dlg').showModal();
  $('#imp-file').addEventListener('change',async ev=>{
    const file=ev.target.files[0]; if(!file)return;
    if(!window.XLSX){$('#imp-prev').textContent='O leitor de planilhas não carregou. Recarregue a página e tente de novo.';return}
    try{
      const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      if(isD){const days=parseDiarioGrid(XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}));formCtx.rows=days;const ks=Object.keys(days).sort();
        $('#imp-prev').innerHTML=ks.length?`<b>${ks.length} dias</b> com registro, de ${fmtD(ks[0])} a ${fmtD(ks[ks.length-1])}.`:'Não encontrei blocos semanais neste arquivo.';$('#imp-go').disabled=!ks.length}
      else{const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});const {items,mapped}=mapRows(col,rows);formCtx.rows=items;
        $('#imp-prev').innerHTML=items.length?`<b>${items.length} ${items.length>1?'linhas':'linha'}</b> prontas. Colunas usadas: ${mapped.map(esc).join(', ')}.`:'Não reconheci as colunas. Confira se a primeira linha tem os títulos.';$('#imp-go').disabled=!items.length}
    }catch(err){$('#imp-prev').textContent='Não consegui ler este arquivo. Salve como .xlsx ou .csv e tente de novo.'}
  });
}
function parseValidade(raw){
  const s=String(raw||'').toLowerCase().trim(); if(!s)return{};
  let m=s.replace(/\s/g,'').match(/^(\d{1,2})m(eses)?$/); if(m)return{pao:+m[1]};
  const mi={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
  m=s.match(/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?\s*\/?\s*(\d{4})/); if(m)return{validade:`${m[2]}-${pad(mi[m[1]])}`};
  m=s.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/); if(m){const y=m[3].length===2?'20'+m[3]:m[3];return{validade:`${y}-${pad(+m[2])}`}}
  m=s.match(/(\d{1,2})\s*[\/\-]\s*(\d{4})/); if(m)return{validade:`${m[2]}-${pad(+m[1])}`};
  m=s.match(/(\d{4})-(\d{2})/); if(m)return{validade:`${m[1]}-${m[2]}`};
  return{obs_validade:String(raw).trim()};
}
function toDateISO(raw){const s=String(raw||'').trim();if(!s)return'';let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(+m[2])}-${pad(+m[1])}`}return''}
function mapRows(col,rows){
  const sc=SCHEMA[col]; if(!rows.length)return{items:[],mapped:[]};
  const headers=Object.keys(rows[0]); const hmap={}; const mapped=[];
  for(const h of headers){const nh=norm(h);const f=sc.fields.find(f=>norm(f.k)===nh||norm(f.l)===nh||(f.al||[]).includes(nh))||sc.fields.find(f=>nh&&(norm(f.l).startsWith(nh)||nh.startsWith(norm(f.k))));if(f&&!Object.values(hmap).includes(f.k)){hmap[h]=f.k;mapped.push(h)}}
  const items=[];
  for(const r of rows){const it={};
    for(const [h,k] of Object.entries(hmap)){const f=sc.fields.find(x=>x.k===k);let v=String(r[h]??'').trim();if(!v)continue;
      if(f.t==='month')Object.assign(it,parseValidade(v));
      else if(f.t==='date')it[k]=toDateISO(v)||'';
      else if(f.t==='number'){const n=parseFloat(v.replace(',','.'));if(!isNaN(n))it[k]=n}
      else it[k]=v}
    if(it[sc.title])items.push(it)}
  return{items,mapped};
}
function parseDiarioGrid(rows){
  const MAPS={'dentrodoplano':'dentro','meioforadoplano':'meio','muitoforadoplano':'muito','refpulada':'pulada','menosptnmaischo':'ptncho','maislip':'lip','meiofora':'meio','muitofora':'muito'};
  const ML={'cafedamanha':'cafe','almoco':'almoco','cafedatarde':'lanche','lanche':'lanche','jantar':'jantar'};
  const days={}; let prev=null; const nowY=new Date().getFullYear();
  for(let i=0;i<rows.length;i++){
    const r=rows[i]; if(!r||!/^\d{1,2}\/\d{1,2}$/.test(String(r[1]||'').trim()))continue;
    const dates=[];
    for(let j=1;j<=7;j++){const s=String(r[j]||'').trim();const m=s.match(/^(\d{1,2})\/(\d{1,2})$/);if(!m){dates.push(null);continue}
      const d=+m[1],mo=+m[2]; let y;
      if(!prev){const isMon=norm((rows[i+1]||[])[j])==='segunda'&&j===1;const cands=[];for(let yy=nowY-4;yy<=nowY;yy++){const dt=new Date(yy,mo-1,d,12);if(!isMon||dt.getDay()===1)cands.push(yy)}y=cands.length?cands[cands.length-1]:nowY}
      else{y=+prev.slice(0,4);if(`${y}-${pad(mo)}-${pad(d)}`<prev)y++}
      const iso=`${y}-${pad(mo)}-${pad(d)}`;dates.push(iso);prev=iso}
    for(let k=1;k<=6;k++){const rr=rows[i+k]||[];const meal=ML[norm(rr[0])];if(!meal)continue;
      dates.forEach((dd,j)=>{if(!dd)return;const st=MAPS[norm(rr[j+1])];if(st)(days[dd]=days[dd]||{})[meal]=st})}
  }
  return days;
}
async function runImport(){
  const {col,rows}=formCtx; if(!rows)return; const btn=$('#imp-go'); btn.disabled=true;
  try{
    if(col==='diario'){
      const byM={};Object.entries(rows).forEach(([d,v])=>{(byM[d.slice(0,7)]=byM[d.slice(0,7)]||{})[d]=v});
      const ms=Object.keys(byM).sort(); let n=0;
      for(const ym of ms){btn.textContent=`Importando ${++n}/${ms.length}…`;const doc=S.data.diario.find(x=>x.id===ym);const dias=JSON.parse(JSON.stringify((doc&&doc.dias)||{}));
        for(const [d,v] of Object.entries(byM[ym]))dias[d]={...(dias[d]||{}),...v};await save('diario',ym,{dias})}
      toast(`${Object.keys(rows).length} dias importados`);
    }else{
      const merge=$('#imp-merge')&&$('#imp-merge').checked;const tk=SCHEMA[col].title;let n=0;
      const key=x=>col==='exames'?norm(x.exame)+'|'+x.data:col==='consultas'?norm(x.especialidade)+'|'+x.data:norm(x[tk]);
      for(const it of rows){btn.textContent=`Importando ${++n}/${rows.length}…`;const ex=merge?S.data[col].find(x=>key(x)===key(it)):null;
        if(ex){const b={...ex,...it};delete b.id;delete b.exemplo;await save(col,ex.id,b)}else await save(col,uid(),it)}
      toast(`${rows.length} itens importados`);
    }
  }catch(e){toast('A importação parou no meio. O que já foi salvo continua no painel.')}
  $('#dlg').close();formCtx=null;
}

/* ---------- exportação ---------- */
async function exportCSV(col){
  const q=v=>{const t=String(v??'');return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  let lines;
  if(col==='diario'){const days=dayMap();lines=[['data',...MEALS.map(m=>m.l),'observação'].join(',')];
    Object.keys(days).sort().forEach(d=>{const v=days[d];lines.push([d,...MEALS.map(m=>v[m.k]?STM[v[m.k]].l:''),v.obs||''].map(q).join(','))})}
  else{const fs=SCHEMA[col].fields;lines=[fs.map(f=>q(f.l)).join(',')];S.data[col].forEach(it=>lines.push(fs.map(f=>q(it[f.k])).join(',')))}
  baixar(`${col}-${today()}.csv`,'\ufeff'+lines.join('\n'),'text/csv;charset=utf-8');
}

/* ---------- eventos ---------- */
const SEL='[data-tab],[data-new],[data-edit],[data-import],[data-export],[data-exsel],[data-act],[data-invf],[data-dp],[data-dday],[data-meal],[data-day],[data-habit],[data-rw],[data-toggle],[data-stop]';
document.addEventListener('click',async e=>{
  if(e.target.closest('dialog'))return;
  if(e.target.matches('input,select,textarea,label')||e.target.closest('label'))return;
  const el=e.target.closest(SEL); if(!el)return;
  const ds=el.dataset;
  if(ds.stop!==undefined)return;
  if(ds.tab){UI.tab=ds.tab;lsSet('sp-tab',ds.tab);try{history.replaceState(null,'','#'+ds.tab)}catch(_){}render(true);window.scrollTo(0,0);return}
  if(ds.new){openForm(ds.new,null,ds.new==='marcos'?{data:today(),tipo:'Consulta'}:ds.new==='habitos'?{meta_semana:7,ativo:'Sim'}:ds.new==='consultas'||ds.new==='exames'?{data:today()}:ds.new==='viagens'?{status:'Ideia'}:ds.new==='projetos'?{status:'Ideia',progresso:0}:['skincare','suplementos','perfumes'].includes(ds.new)?{em_uso:'Sim'}:{});return}
  if(ds.edit){openForm(ds.edit,ds.id);return}
  if(ds.import){openImport(ds.import);return}
  if(ds.export){exportCSV(ds.export);return}
  if(ds.exsel!==undefined){UI.exameSel=UI.exameSel===ds.exsel?'':ds.exsel;render(true);return}
  if(ds.act==='settings'){openSettings();return}
  if(ds.act==='clear-ex'){for(const c of ds.cols.split(','))for(const it of S.data[c].filter(x=>x.exemplo))await remove(c,it.id);toast('Exemplos removidos');return}
  if(ds.invf){UI.inv[ds.invf].filter=ds.v;render(true);return}
  if(ds.toggle){const U=UI.inv[ds.toggle];U.open=U.open===ds.id?null:ds.id;render(true);return}
  if(ds.dp){UI.diario.preset=ds.dp;render(true);return}
  if(ds.dday!==undefined){const n=+ds.dday;UI.diario.date=n===0?today():addDays(UI.diario.date,n);render(true);return}
  if(ds.meal){setMeal(UI.diario.date,ds.meal,ds.st);return}
  if(ds.day&&el.classList.contains('cell')){UI.diario.date=ds.day;UI.tab='diario';render(true);window.scrollTo({top:0,behavior:'smooth'});return}
  if(ds.habit&&el.classList.contains('tick')){toggleHabit(ds.habit,ds.day);return}
  if(ds.rw!==undefined){const n=+ds.rw;UI.rotinaWeek=n===0?mondayOf(today()):addDays(UI.rotinaWeek,n);render(true);return}
});
document.addEventListener('change',e=>{
  const t=e.target; if(t.closest('dialog'))return;
  if(t.id==='d-date'&&t.value){UI.diario.date=t.value;render(true)}
  else if(t.id==='d-obs'){setObs(UI.diario.date,t.value.trim())}
  else if(t.id==='d-from'){UI.diario.from=t.value;render(true)}
  else if(t.id==='d-to'){UI.diario.to=t.value;render(true)}
  else if(t.dataset.dm){UI.diario[t.dataset.dm]=t.value;render(true)}
  else if(t.dataset.habit&&t.type==='checkbox'){toggleHabit(t.dataset.habit,t.dataset.day)}
  else if(t.dataset.trip){const v=S.data.viagens.find(x=>x.id===t.dataset.trip);if(!v)return;const L=String(v.checklist||'').split('\n').map(s=>s.trim()).filter(Boolean);const i=+t.dataset.line;L[i]=t.checked?'[x] '+L[i].replace(/^\[x\]\s*/i,''):L[i].replace(/^\[x\]\s*/i,'');const b={...v,checklist:L.join('\n')};delete b.id;save('viagens',v.id,b)}
});
let qT;document.addEventListener('input',e=>{const t=e.target;if(t.dataset.invq){clearTimeout(qT);qT=setTimeout(()=>{UI.inv[t.dataset.invq].q=t.value;render(true);const n=$('#q-'+t.dataset.invq);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target.closest('.prod,.qcard,.mini,.exrow,.rowi,.todo>div');if(el&&e.target===el){e.preventDefault();el.click()}});

render(); initStore();
